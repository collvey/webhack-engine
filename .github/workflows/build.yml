name: Build engine

# Builds the WebAssembly engine on every push and pull request, and publishes
# a GitHub Release with the three engine files whenever a version tag
# (v*) is pushed. The WebHack and WebHack-Steam clients download the files of
# the release they pin; see README.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create releases on tag pushes

env:
  # Pinned toolchain. Building with this version reproduces released files byte
  # for byte (verified against the files previously committed in WebHack).
  EMSDK_VERSION: 4.0.17

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build
        run: bash scripts/build-wasm.sh

      - name: Write release manifest
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME}"
          node -e '
            const fs = require("fs");
            const sums = Object.fromEntries(fs.readFileSync("SHA256SUMS","utf8").trim().split("\n").map(l => { const [h,f] = l.trim().split(/\s+/); return [f,h]; }));
            const files = ["nethack.js","nethack.wasm","nethack.data"].map(f => ({ name: f, size: fs.statSync(f).size, sha256: sums[f] }));
            fs.writeFileSync("manifest.json", JSON.stringify({
              name: "webhack-engine",
              version: process.argv[1],
              commit: process.argv[2],
              emscripten: process.argv[3],
              builtAt: new Date().toISOString(),
              files
            }, null, 2) + "\n");
          ' "$VERSION" "$GITHUB_SHA" "$EMSDK_VERSION"
          cat manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webhack-engine-${{ github.sha }}
          path: |
            dist/nethack.js
            dist/nethack.wasm
            dist/nethack.data
            dist/SHA256SUMS
            dist/manifest.json
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "WebHack engine ${GITHUB_REF_NAME} — NetHack 3.6.7 compiled to WebAssembly with Emscripten ${EMSDK_VERSION} from ${GITHUB_SHA}."
            echo
            echo "Files consumed by the WebHack and WebHack-Steam clients:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "\`manifest.json\` lists version, commit, toolchain and per-file checksums."
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "webhack-engine ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/nethack.js dist/nethack.wasm dist/nethack.data dist/SHA256SUMS dist/manifest.json
